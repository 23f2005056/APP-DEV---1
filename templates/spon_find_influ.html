      <form action="/influencer/View" method="POST">
        <div class="modal fade" id="viewiModal" tabindex="-1" role="dialog" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
      
              <div class="modal-header">
                <h5 class="modal-title">view Campaign</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              
              <div class="modal-body">
                <label for="title" class="form-label">name</label>
                <input type="text" class="form-control" name="name" id="name" readonly>
                <label for="description" class="form-label">id</label>
                <textarea class="form-control" name="description" id="id" rows="2" readonly></textarea>
                <label for="rating" class="form-label">platform</label>
                <input type="text" class="form-control" name="rating" id="platform" readonly>
                <label for="rating" class="form-label">followers</label>
                <input type="text" class="form-control" name="rating" id="followers" readonly>

              </div>
        
            
            </div>
          </div>
        </div>
        </form>
        <script>
          $("#viewiModal").on("show.bs.modal", function(event){
            var st=$(event.relatedTarget).data('val');
            var values=st.split('#');
            $(this).find('#name').val(values[0]);
            $(this).find('#id').val(values[1]);
            $(this).find('#platform').val(values[2]);
            $(this).find('#followers').val(values[3]);
          });
          </script>
      
      
      
      
          <form action="/influencer/request" method="POST">
            <div class="modal fade" id="requestiModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                  <div class="modal-dialog">
                    <div class="modal-content">
                      <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">request influencer </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                      </div>
                      
                      <div class="modal-body">

                        <label for="sponsorName" class="form-label">Sponsor Name</label>
                        <input type="text" class="form-control" name="sponsorName" id="uname" readonly>
                        
                        <label for="campid" class="form-label"> campaign Title</label>
                        <input type="text" class="form-control" name="title" id="tit" readonly/>
                        <label for="campid" class="form-label">note</label>
                        <input type="text" class="form-control" name="note" id="note" rows="4" />

                        <label for="campid" class="form-label"></label>
                        <input type="text" class="form-control" name="campid" id="campid" hidden/>
                        <label for="influid" class="form-label"></label>
                        <input type="text" class="form-control" name="influid" id="influid" hidden >
                        <label for="sponid" class="form-label"></label>
                        <input type="text" class="form-control" name="sponid" id="sponid" hidden>
                        <label for="sponid" class="form-label"></label>
                        <input type="text" class="form-control" name="des" id="des" hidden>
                      </div>
                      <div class="modal-footer">
                        <button class="btn btn-primary" >Request</button>
                      </div>
                    
                    </div>
                  </div>
                </div>
              </form>
              
              <script>
                $("#requestiModal").on("show.bs.modal", function(event){
                    var st=$(event.relatedTarget).data('val');
                    var values=st.split('#');
                    $(this).find('#uname').val(values[1]);
                    $(this).find('#influid').val(values[2]);
                    $(this).find('#sponid').val(values[3]);
                    $(this).find('#tit').val(values[5]);
                    $(this).find('#campid').val(values[4]);
                    $(this).find('#des').val(values[6]);
                });
              </script>
