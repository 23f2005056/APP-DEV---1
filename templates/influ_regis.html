<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css"> <!--calling external sytles -->
    <!--third party bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Influencer Registration</title>
</head>
<body>
    <div id="container">
        <div id="panel">
            <div id="input-form">
            <h2>Influencer Registration</h2>
            <form action="/influ_regis" method="POST">
                <div class="mb-3">
                  <label for="username" class="form-label">User Name</label>
                  <input type="text" class="form-control" id="username" name="username" >
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-3">
                  <label for="platform" class="form-label">Platform Preference:</label>
                  <select id="platform-select" name="platform" style="width: 200px; padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 5px;">
                      <option value="youtube">YouTube</option>
                      <option value="twitter">Twitter</option>
                      <option value="instagram">Instagram</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="followers" class="form-label">followers</label>
                  <input type="number" class="form-control" id="followers" name="followers" required>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
                {{msg}}
              </form>
            </div>
        </div>
    </div>
</body>
</html>
