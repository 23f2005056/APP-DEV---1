<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css"> <!--calling external sytles -->
    <!--third party bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Sponsor Registration</title>
</head>
<body>
    <div id="container">
        <div id="panel">
            <div id="input-form">
            <h2>Sponsor Registration</h2>
            <form action="/spon_regis" method="POST">
                <div class="mb-3">
                  <label for="username" class="form-label">User Name</label>
                  <input type="text" class="form-control" id="username" name="username" aria-describedby="userHelp">
                </div>
                <div class="mb-3">
                  <label for="pwd" class="form-label">Password</label>
                  <input type="password" class="form-control" id="pwd" name="pwd" required>
                </div>
                <div class="mb-3">
                  <label for="industry" class="form-label">Industry</label>
                  <input type="text" name="industry" class="form-control" id="industry">
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
                {{msg}}
              </form>
            </div>
        </div>
    </div>
</body>
</html>
