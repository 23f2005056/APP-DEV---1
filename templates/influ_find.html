<div class="container-fluid d-flex align-items-center justify-content-center my-3">
    <div class="input-group" style="width: 75%;">
        <form action="" method="get" style="display: flex; width: 100%;">
            <input type="text" name="search" class="form-control me-2" placeholder="Search..." aria-label="Search">
            <button class="btn btn-outline-secondary px-4" type="submit">
                Search
            </button>
        </form>
    </div>
</div>




<div class="container mt-4">
  <h2>Active Campaigns</h2>
  {% if campaigns %}
      {% for camp in campaigns %}
          <div class="card mb-3">
              <div class="card-body d-flex justify-content-between align-items-center">
                  <span>{{ camp.title }}</span>
                  <div>
                      <button class="btn btn-secondary me-2" data-bs-toggle="modal" data-bs-target="#viewcModal" data-val="{{ camp.title }}#{{ camp.description }}#{{ camp.budget }}">View</button>
                      <button class="btn btn-info me-2" data-bs-toggle="modal" data-bs-target="#requestcModal" data-val="{{uname}}#{{ camp.title }}#{{camp.budget}}#{{camp.end_date}}#{{ camp.id }}#{{id}}#{{fol}}">Request</button>
                  </div>
              </div>
          </div>
      {% endfor %}
  {% endif %}
</div>

<!-- View Campaign Modal -->
<form action="/campaign/view" method="POST">
  <div class="modal fade" id="viewcModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
          <div class="modal-content">
              <div class="modal-header">
                  <h5 class="modal-title">View Campaign</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                  <label for="viewTitle" class="form-label">Title</label>
                  <input type="text" class="form-control" name="title" id="viewTitle" readonly>
                  <label for="viewDescription" class="form-label">Description</label>
                  <textarea class="form-control" name="description" id="viewDescription" rows="2" readonly></textarea>
                  <label for="viewBudget" class="form-label">Budget</label>
                  <input type="text" class="form-control" name="budget" id="viewBudget" readonly>
              </div>
          </div>
      </div>
  </div>
</form>

<form action="/sponsor/request" method="POST">
    <div class="modal fade" id="requestcModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">request sponsor </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              
              <div class="modal-body">
                <label for="sponsorName" class="form-label">campaign title</label>
                <input type="text" class="form-control" name="title" id="title" readonly>
                <label for="sponsorName" class="form-label">Budget</label>
                <input type="text" class="form-control" name="budget" id="budget" readonly>
                <label for="sponsorName" class="form-label">end date</label>
                <input type="text" class="form-control" name="enddate" id="enddate" readonly>
                <label for="sponsorName" class="form-label"></label>
                <input type="text" class="form-control" name="note" id="note" hidden>
                <label for="campid" class="form-label"></label>
                <input type="text" class="form-control" name="campid" id="campid" hidden/>
                <label for="campid" class="form-label"></label>
                <input type="text" class="form-control" name="influid" id="influid"  hidden/>
                <label for="campid" class="form-label"></label>
                <input type="text" class="form-control" name="uname" id="uname"  hidden/>
                <label for="fol" class="form-label"></label>
                <input type="text" class="form-control" name="fol" id="fol"  hidden/>
                <label for="fol" class="form-label"></label>
                <input type="text" class="form-control" name="bug" id="bug"  hidden/>
              </div>
              <div class="modal-footer">
                <button class="btn btn-primary" >Request</button>
              </div>
            
            </div>
          </div>
        </div>
</form>

<script>
$("#requestcModal").on("show.bs.modal", function(event){
    var st=$(event.relatedTarget).data('val');
    var values=st.split('#');
    $(this).find('#title').val(values[1]);
    $(this).find('#budget').val(values[2]);
    $(this).find('#enddate').val(values[3]);
    $(this).find('#campid').val(values[4]);
    $(this).find('#influid').val(values[5]);
    $(this).find('#uname').val(values[0]);
    $(this).find('#fol').val(values[6]);

});
</script>

<script>
  $(document).ready(function () {
      $('#viewcModal').on('show.bs.modal', function (event) {
          var button = $(event.relatedTarget);
          var data = button.data('val').split('#');
          $('#viewTitle').val(data[0]);
          $('#viewDescription').val(data[1]);
          $('#viewBudget').val(data[2]);
      });

      $('#requestcModal').on('show.bs.modal', function (event) {
          var button = $(event.relatedTarget);
          var data = button.data('val').split('#');
          $('#requestTitle').text(data[0]);
          $('#requestHiddenTitle').val(data[0]);
          $('#requestSubmitButton').data('campaignId', data[2]);
          console.log(data);
      });

      //$('#requestSubmitButton').on('click', function () {
        //  var campaignId = $(this).data('campaignId');
        //  $('#requestForm').attr('action', '/campaign/request/' + campaignId);
        // $('#requestForm').submit();
      //});
  });
</script>

</body>
