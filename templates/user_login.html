<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css"> <!--calling external sytles -->
    <!--third party bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>User Login </title>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Influencer and Sponsor Engagement</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/influ_regis">Influencer Regis</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/spon_regis">Sponsor Regis</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

    <div id="container">
        <div id="panel">
            <div id="input-form" style="height: 400px;">
            <h2>User Login</h2>
            <form action="/user_login" method="POST" >
                <div class="mb-3">
                  <label for="username" class="form-label">User Name</label>
                  <input type="text" class="form-control" name="username" id="username" aria-describedby="userHelp">
                </div>
                <div class="mb-3">
                  <label for="pwd" class="form-label">Password</label>
                  <input type="password" name="pwd" class="form-control" id="pwd" required>
                </div>
                <button type="submit" class="btn btn-success">Login</button>
                <br>{{msg}}
              </form>
            </div>
        </div>
    </div>
</body>
</html>
